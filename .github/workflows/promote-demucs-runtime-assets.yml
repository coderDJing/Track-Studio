name: Promote Demucs Runtime Assets

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Stable app version to align with the promoted runtime assets
        required: true
      source_release_tag:
        description: Source RC runtime release tag
        required: true
        default: demucs-runtime-assets-rc
      target_release_tag:
        description: Target stable runtime release tag
        required: true
        default: demucs-runtime-assets

permissions:
  contents: write

jobs:
  promote_runtime_assets:
    concurrency:
      group: demucs-runtime-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test runtime publication and retention
        run: node --test scripts/publish-demucs-runtime-assets.spec.mjs

      - name: Download source runtime release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_release_tag }}
        run: |
          set -euo pipefail
          node scripts/publish-demucs-runtime-assets.mjs download \
            --tag "$SOURCE_TAG" --dir artifacts/source-runtime

      - name: Promote RC runtime manifest to stable channel
        run: |
          set -euo pipefail
          node scripts/promote-demucs-runtime-assets.mjs \
            --source-root artifacts/source-runtime \
            --output-root dist/demucs-runtime-assets \
            --source-release-tag "${{ inputs.source_release_tag }}" \
            --target-release-tag "${{ inputs.target_release_tag }}" \
            --app-version "${{ inputs.app_version }}"

      - name: Show promoted runtime assets
        run: find dist/demucs-runtime-assets -maxdepth 1 -type f | sort

      - name: Publish verified stable runtime assets and retain rollback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ inputs.target_release_tag }}
        run: |
          set -euo pipefail
          node scripts/publish-demucs-runtime-assets.mjs publish \
            --tag "$TARGET_TAG" --dir dist/demucs-runtime-assets --apply
