name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  validate_release_tag:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/') ||
        (
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'chore(release):')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "No tag push; release tag validation is not required for this run."
            exit 0
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$TAG_NAME" != "$package_version" ]]; then
            echo "::error::Release tag '$TAG_NAME' must exactly match package.json version '$package_version'."
            exit 1
          fi
          echo "Validated release tag: $TAG_NAME"

  typecheck:
    needs: [validate_release_tag]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/') ||
        (
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'chore(release):')
        )
      }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --prefer-offline --ignore-scripts

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Check file-path comparisons
        run: node scripts/check-file-path-comparisons.mjs

  build_win:
    needs: [validate_release_tag]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/') ||
        (
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'chore(release):')
        )
      }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Demucs models cache (Windows)
        uses: actions/cache@v5
        with:
          path: |
            vendor/demucs/models
          key: demucs-models-${{ runner.os }}-${{ hashFiles('scripts/demucs-model-manifest.json', 'scripts/ensure-demucs-runtime.mjs', 'scripts/lib/*.mjs') }}
          restore-keys: |
            demucs-models-${{ runner.os }}-

      - name: Restore Rekordbox runtime cache (Windows)
        uses: actions/cache@v5
        with:
          path: |
            vendor/rekordbox-desktop-runtime/win32-x64/python
          key: rekordbox-runtime-${{ runner.os }}-${{ hashFiles('scripts/ensure-rekordbox-desktop-runtime.mjs', 'scripts/rekordbox-desktop-runtime-requirements.txt', 'scripts/lib/demucs-standalone-python.mjs', 'scripts/lib/demucs-runtime-support.mjs') }}
          restore-keys: |
            rekordbox-runtime-${{ runner.os }}-

      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Ensure setuptools available
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache (Windows)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_package/target
          key: cargo-${{ runner.os }}-x86_64-pc-windows-msvc-${{ hashFiles('rust_package/Cargo.lock', 'rust_package/Cargo.toml', 'rust_package/build.rs', 'rust_package/src/**', 'rust_package/native/qm/**', 'rust_package/native/soundtouch/**', 'rust_package/native/chromaprint/**', 'rust_package/native/ffmpeg/frkb_ffmpeg_decode_wrapper.*') }}
          restore-keys: |
            cargo-${{ runner.os }}-x86_64-pc-windows-msvc-

      - name: Restore Electron builder cache (Windows)
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --prefer-offline

      - name: Ensure Demucs models (Windows)
        run: node scripts/ensure-demucs-runtime.mjs --models-only --ci

      - name: Ensure Rekordbox Desktop runtime (Windows)
        run: pnpm run rekordbox:runtime:ensure

      - name: Validate Rekordbox Desktop runtime (Windows)
        run: pnpm run rekordbox:runtime:validate -- --platform-key win32-x64

      - name: Prepare FFmpeg (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg/win32-x64 | Out-Null

          # BtbN 的 latest 滚动标签下资产名固定，优先按固定 URL 直连下载。
          # 走 api.github.com 会在匿名/额度耗尽时直接 403 限流，导致整条发布中断。
          $downloadUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $downloaded = $false
          try {
            Write-Host "Downloading $downloadUrl"
            Invoke-WebRequest -Uri $downloadUrl -OutFile ffmpeg.zip -MaximumRetryCount 5 -RetryIntervalSec 5
            $downloaded = $true
          } catch {
            Write-Host "WARN: 固定 URL 下载失败，回退到 gh api 解析：$($_.Exception.Message)"
          }
          if (-not $downloaded) {
            # 兜底：gh 走 GITHUB_TOKEN 认证，不会像裸 Invoke-RestMethod 那样被当作匿名请求限流
            $assetName =
              gh api repos/BtbN/FFmpeg-Builds/releases/latest --jq '.assets[].name' |
              Where-Object { $_ -match '^ffmpeg-.*-win64-gpl\.zip$' } |
              Select-Object -First 1
            if (-not $assetName) {
              throw 'win64 gpl ffmpeg asset not found in latest BtbN release.'
            }
            $downloadUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$assetName"
            Write-Host "Downloading $downloadUrl"
            Invoke-WebRequest -Uri $downloadUrl -OutFile ffmpeg.zip -MaximumRetryCount 5 -RetryIntervalSec 5
          }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_unzip -Force
          $ff = (Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg_unzip | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem -Recurse -Filter ffprobe.exe ffmpeg_unzip | Select-Object -First 1).FullName
          if (-not $ff) {
            throw "ffmpeg.exe not found in downloaded archive."
          }
          if (-not $ffprobe) {
            throw "ffprobe.exe not found in downloaded archive."
          }
          Copy-Item -Path $ff -Destination vendor/ffmpeg/win32-x64/ffmpeg.exe -Force
          Copy-Item -Path $ffprobe -Destination vendor/ffmpeg/win32-x64/ffprobe.exe -Force
          Remove-Item ffmpeg.zip -Force
          Remove-Item ffmpeg_unzip -Recurse -Force

      - name: Prepare FFmpeg native dependencies (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 同 Prepare FFmpeg (Windows)：固定 URL 直连，避免 api.github.com 限流
          $downloadUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
          $downloaded = $false
          try {
            Write-Host "Downloading $downloadUrl"
            Invoke-WebRequest -Uri $downloadUrl -OutFile ffmpeg-shared.zip -MaximumRetryCount 5 -RetryIntervalSec 5
            $downloaded = $true
          } catch {
            Write-Host "WARN: 固定 URL 下载失败，回退到 gh api 解析：$($_.Exception.Message)"
          }
          if (-not $downloaded) {
            $assetName =
              gh api repos/BtbN/FFmpeg-Builds/releases/latest --jq '.assets[].name' |
              Where-Object { $_ -match '^ffmpeg-.*-win64-gpl-shared\.zip$' } |
              Select-Object -First 1
            if (-not $assetName) {
              throw 'win64 gpl shared ffmpeg asset not found in latest BtbN release.'
            }
            $downloadUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$assetName"
            Write-Host "Downloading $downloadUrl"
            Invoke-WebRequest -Uri $downloadUrl -OutFile ffmpeg-shared.zip -MaximumRetryCount 5 -RetryIntervalSec 5
          }
          Expand-Archive -Path ffmpeg-shared.zip -DestinationPath ffmpeg_shared_unzip -Force
          $binDir = Get-ChildItem -Recurse -Directory ffmpeg_shared_unzip | Where-Object { $_.Name -eq 'bin' } | Select-Object -First 1
          if (-not $binDir) {
            throw "bin directory not found in shared ffmpeg archive."
          }
          $sharedRoot = $binDir.Parent.FullName
          $includeDir = Join-Path $sharedRoot 'include'
          $libDir = Join-Path $sharedRoot 'lib'
          if (-not (Test-Path $includeDir)) {
            throw "include directory not found in shared ffmpeg archive."
          }
          if (-not (Test-Path $libDir)) {
            throw "lib directory not found in shared ffmpeg archive."
          }
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg/win32-x64/dll | Out-Null
          Get-ChildItem -Path $binDir.FullName -Filter "*.dll" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "vendor/ffmpeg/win32-x64/dll/$($_.Name)" -Force
          }
          $nativeFfmpegDir = 'rust_package/native/ffmpeg/win32-x64'
          New-Item -ItemType Directory -Force -Path "$nativeFfmpegDir/include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$nativeFfmpegDir/lib" | Out-Null
          foreach ($dirName in @('libavcodec', 'libavformat', 'libavutil', 'libswresample')) {
            Copy-Item -Path (Join-Path $includeDir $dirName) -Destination "$nativeFfmpegDir/include/" -Recurse -Force
          }
          foreach ($libName in @('avcodec.lib', 'avformat.lib', 'avutil.lib', 'swresample.lib')) {
            Copy-Item -Path (Join-Path $libDir $libName) -Destination "$nativeFfmpegDir/lib/$libName" -Force
          }
          Remove-Item ffmpeg-shared.zip -Force
          Remove-Item ffmpeg_shared_unzip -Recurse -Force
          Write-Host "FFmpeg DLLs copied to vendor/ffmpeg/win32-x64/dll/"
          Get-ChildItem vendor/ffmpeg/win32-x64/dll/ | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1MB,1))MB)" }
          Write-Host "FFmpeg native headers/libs copied to $nativeFfmpegDir"

      - name: Validate bundled media tools (Windows)
        run: node scripts/validate-bundled-media-tools.mjs --mode package --platform-key win32-x64

      - name: Build Rust N-API (rust_package)
        working-directory: rust_package
        run: npx --yes @napi-rs/cli@2.18.4 build --platform --release --target x86_64-pc-windows-msvc

      - name: Build (vite)
        env:
          CLOUD_SYNC_BASE_URL_PROD: ${{ secrets.CLOUD_SYNC_BASE_URL_PROD }}
          CLOUD_SYNC_API_SECRET_KEY: ${{ secrets.CLOUD_SYNC_API_SECRET_KEY }}
          FRKB_LASTFM_API_KEY: ${{ secrets.FRKB_LASTFM_API_KEY }}
        run: pnpm build

      - name: Build Windows installer frontend
        run: pnpm installer-ui:build

      - name: Package (electron-builder, no publish)
        run: npx electron-builder --win --x64 --publish never

      - name: Verify packaged native module (Windows)
        shell: pwsh
        run: |
          $resourcesRoot = "dist/win-unpacked/resources"
          $dllDir = Join-Path $resourcesRoot "ffmpeg/win32-x64/dll"
          $nativeModule = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/rust_package/index.win32-x64-msvc.node"

          if (-not (Test-Path $dllDir)) {
            throw "Packaged FFmpeg DLL directory not found: $dllDir"
          }
          if (-not (Test-Path $nativeModule)) {
            throw "Packaged Rust native module not found: $nativeModule"
          }

          $env:PATH = "$dllDir;$env:PATH"
          node -e "require('./dist/win-unpacked/resources/app.asar.unpacked/node_modules/rust_package'); console.log('Packaged Rust native module loaded.')"

      - name: Verify packaged Demucs resources (Windows)
        shell: pwsh
        run: |
          $resourcesRoot = "dist/win-unpacked/resources"
          if (-not (Test-Path $resourcesRoot)) {
            throw "Windows unpacked resources directory not found: $resourcesRoot"
          }

          $required = @(
            "ffmpeg/win32-x64/ffmpeg.exe",
            "ffmpeg/win32-x64/ffprobe.exe",
            "demucs/bootstrap/mixtape_demucs_bootstrap.py",
            "demucs/bootstrap/beat_this_bridge.py",
            "demucs/bootstrap/bpm_fix.py",
            "demucs/bootstrap/bpm_fix_grid.py",
            "demucs/bootstrap/bpm_fix_crosscheck.py",
            "demucs/bootstrap/bpm_fix_rubberband.py",
            "demucs/bootstrap/rkb_official_phase_selector.py",
            "demucs/models/htdemucs.yaml",
            "demucs/models/955717e8-8726e21a.th",
            "rekordboxDesktopLibrary/bridge.py",
            "rekordboxDesktopRuntime/win32-x64/python/python.exe",
            "rekordboxDesktopRuntime/win32-x64/python/Lib/site-packages/pyrekordbox/__init__.py"
          )

          $missing = @()
          foreach ($relativePath in $required) {
            $targetPath = Join-Path $resourcesRoot $relativePath
            if (-not (Test-Path $targetPath)) {
              $missing += $relativePath
            }
          }

          $unexpectedRuntimeRoot = Join-Path $resourcesRoot "demucs/win32-x64"
          if (Test-Path $unexpectedRuntimeRoot) {
            $missing += "unexpected:demucs/win32-x64"
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing packaged Demucs resources (Windows):"
            $missing | ForEach-Object { Write-Error "  - $_" }
            exit 1
          }

          Write-Host "Packaged Demucs resources verified (Windows, runtime excluded)."
          python scripts/verify_packaged_python_import_closure.py `
            --source-root scripts `
            --packaged-root "$resourcesRoot/demucs/bootstrap" `
            --entry beat_this_bridge.py

      # 不再复制 rc.yml，严格遵循 GitHub provider 读取 latest.yml / latest-mac.yml

      - name: Upload dist artifacts (Windows)
        uses: actions/upload-artifact@v7
        if: always() && startsWith(github.ref, 'refs/tags/')
        with:
          name: win-artifacts
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml

  build_rekordbox_runtime_mac_x64:
    needs: [validate_release_tag]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/') ||
        (
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'chore(release):')
        )
      }}
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore Rekordbox runtime cache (macOS x64)
        uses: actions/cache@v5
        with:
          path: |
            vendor/rekordbox-desktop-runtime/darwin-x64/python
          key: rekordbox-runtime-${{ runner.os }}-${{ runner.arch }}-darwin-x64-${{ hashFiles('scripts/ensure-rekordbox-desktop-runtime.mjs', 'scripts/rekordbox-desktop-runtime-requirements.txt', 'scripts/lib/demucs-standalone-python.mjs', 'scripts/lib/demucs-runtime-support.mjs') }}
          restore-keys: |
            rekordbox-runtime-${{ runner.os }}-${{ runner.arch }}-darwin-x64-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Ensure Rekordbox Desktop runtime (macOS x64)
        run: node scripts/ensure-rekordbox-desktop-runtime.mjs --platform-key darwin-x64

      - name: Validate Rekordbox Desktop runtime (macOS x64)
        run: node scripts/validate-rekordbox-desktop-runtime.mjs --platform-key darwin-x64

      - name: Archive Rekordbox Desktop runtime (macOS x64)
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/rekordbox-runtime-darwin-x64.tar.gz \
            -C vendor/rekordbox-desktop-runtime/darwin-x64 \
            python

      - name: Upload Rekordbox runtime artifact (macOS x64)
        uses: actions/upload-artifact@v7
        with:
          name: rekordbox-runtime-darwin-x64
          path: dist/rekordbox-runtime-darwin-x64.tar.gz

      - name: Restore Intel FFmpeg static libs cache
        uses: actions/cache@v5
        with:
          path: dist/ffmpeg-x64-dev
          key: ffmpeg-dev-macos-x64-v1-${{ hashFiles('rust_package/Cargo.toml', 'rust_package/Cargo.lock', 'rust_package/native/ffmpeg/frkb_ffmpeg_decode_wrapper.*') }}

      - name: Prepare Intel FFmpeg static libs
        run: |
          set -euo pipefail
          if [ -f dist/ffmpeg-x64-dev/lib/libavcodec.a ] && \
             [ -f dist/ffmpeg-x64-dev/lib/libavformat.a ] && \
             [ -f dist/ffmpeg-x64-dev/lib/libavutil.a ] && \
             [ -f dist/ffmpeg-x64-dev/lib/libswresample.a ] && \
             [ -f dist/ffmpeg-x64-dev/include/libavcodec/avcodec.h ] && \
             lipo -archs dist/ffmpeg-x64-dev/lib/libavcodec.a | grep -q 'x86_64'; then
            echo "Using cached Intel FFmpeg static libraries."
            exit 0
          fi

          # The hosted Intel runner ships an unrelated HashiCorp tap with a
          # broken vagrant formula, which makes `brew update` emit an error.
          if brew tap | grep -Fxq 'hashicorp/tap'; then
            # The runner may have packer installed from this tap; force only
            # removes the tap metadata and leaves unrelated formulae intact.
            brew untap --force hashicorp/tap
          fi
          brew update
          # The Intel runner links OpenSSL 1.1 into /usr/local. Unlink it
          # before FFmpeg upgrades OpenSSL 3, so bin/openssl does not conflict.
          if brew list --formula | grep -Fxq 'openssl@1.1'; then
            brew unlink openssl@1.1
          fi
          # Runner-created links can remain after `brew unlink` reports zero
          # removals. Remove only an openssl executable link owned by 1.1.
          brew_prefix="$(brew --prefix)"
          openssl_bin="${brew_prefix}/bin/openssl"
          if [ -L "$openssl_bin" ]; then
            case "$(readlink "$openssl_bin")" in
              "${brew_prefix}/opt/openssl@1.1/bin/openssl"|../opt/openssl@1.1/bin/openssl|\
              "${brew_prefix}/Cellar/openssl@1.1/"*/bin/openssl|../Cellar/openssl@1.1/*/bin/openssl)
                rm -- "$openssl_bin"
                ;;
            esac
          fi
          brew install ffmpeg
          mkdir -p dist/ffmpeg-x64-dev/lib dist/ffmpeg-x64-dev/include
          for lib in libavcodec libavformat libavutil libswresample; do
            cp -L "$(brew --prefix)/lib/${lib}.a" dist/ffmpeg-x64-dev/lib/
            cp -RL "$(brew --prefix)/include/${lib}" dist/ffmpeg-x64-dev/include/
          done

      - name: Upload Intel FFmpeg dev artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-x64-dev
          path: dist/ffmpeg-x64-dev

  build_mac:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/') ||
        (
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'chore(release):')
        )
      }}
    runs-on: macos-latest
    needs: [validate_release_tag, build_rekordbox_runtime_mac_x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Rekordbox runtime cache (macOS arm64)
        uses: actions/cache@v5
        with:
          path: |
            vendor/rekordbox-desktop-runtime/darwin-arm64/python
          key: rekordbox-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ensure-rekordbox-desktop-runtime.mjs', 'scripts/rekordbox-desktop-runtime-requirements.txt', 'scripts/lib/demucs-standalone-python.mjs', 'scripts/lib/demucs-runtime-support.mjs') }}
          restore-keys: |
            rekordbox-runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Ensure setuptools available
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Ensure Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Restore Cargo cache (macOS)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_package/target
          key: cargo-${{ runner.os }}-universal-${{ hashFiles('rust_package/Cargo.lock', 'rust_package/Cargo.toml', 'rust_package/build.rs', 'rust_package/src/**', 'rust_package/native/qm/**', 'rust_package/native/soundtouch/**', 'rust_package/native/chromaprint/**', 'rust_package/native/ffmpeg/frkb_ffmpeg_decode_wrapper.*') }}
          restore-keys: |
            cargo-${{ runner.os }}-universal-

      - name: Restore Electron builder cache (macOS)
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --prefer-offline

      - name: Ensure Demucs models (macOS)
        run: node scripts/ensure-demucs-runtime.mjs --models-only --ci

      - name: Ensure Rekordbox Desktop runtime (macOS arm64)
        run: pnpm run rekordbox:runtime:ensure

      - name: Download Intel FFmpeg dev artifact
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-x64-dev
          path: artifacts/ffmpeg-x64-dev

      - name: Download Rekordbox runtime artifact (macOS x64)
        uses: actions/download-artifact@v8
        with:
          name: rekordbox-runtime-darwin-x64
          path: artifacts/rekordbox-runtime-darwin-x64

      - name: Restore Rekordbox runtime artifact (macOS x64)
        run: |
          set -euo pipefail
          mkdir -p vendor/rekordbox-desktop-runtime/darwin-x64
          tar -xzf artifacts/rekordbox-runtime-darwin-x64/rekordbox-runtime-darwin-x64.tar.gz \
            -C vendor/rekordbox-desktop-runtime/darwin-x64

      - name: Validate Rekordbox Desktop runtime (macOS universal)
        run: pnpm run rekordbox:runtime:validate:mac-universal

      - name: Prepare portable FFmpeg (macOS universal)
        run: node scripts/ensure-bundled-media-tools.mjs --mode package --platform-key darwin-universal

      - name: Prepare FFmpeg native dependencies (macOS)
        run: |
          set -euxo pipefail

          # Homebrew is used only for Rust link inputs, never shipped executables.
          if brew tap | grep -Fxq 'hashicorp/tap'; then
            brew untap --force hashicorp/tap
          fi
          brew update
          brew install ffmpeg

          copy_ffmpeg_dev_files() {
            local source_prefix="$1"
            local dest_dir="$2"
            local lib_dir="$source_prefix/lib"
            local include_dir="$source_prefix/include"

            mkdir -p "$dest_dir/lib" "$dest_dir/include"

            for lib in libavcodec libavformat libavutil libswresample; do
              if [ -f "$lib_dir/${lib}.a" ]; then
                cp -L "$lib_dir/${lib}.a" "$dest_dir/lib/"
                echo "Copied ${lib}.a from ${lib_dir}"
              else
                echo "ERROR: ${lib}.a not found at ${lib_dir}/"
                exit 1
              fi
            done

            for dir in libavcodec libavformat libavutil libswresample; do
              if [ -d "$include_dir/$dir" ]; then
                rm -rf "$dest_dir/include/$dir"
                cp -RL "$include_dir/$dir" "$dest_dir/include/"
                echo "Copied ${dir} headers from ${include_dir}"
              else
                echo "ERROR: ${dir} headers not found at ${include_dir}/"
                exit 1
              fi
            done

            if [ ! -f "$dest_dir/include/libavcodec/avcodec.h" ]; then
              echo "ERROR: copied FFmpeg headers are incomplete at ${dest_dir}/include"
              find "$dest_dir/include" -maxdepth 2 -type l -o -type f | head -n 40 || true
              exit 1
            fi

            echo "=== FFmpeg native deps: ${dest_dir} ==="
            file "$dest_dir/lib/libavcodec.a" || true
            ls -lh "$dest_dir/lib/"
            ls "$dest_dir/include/"
          }

          ARM64_BREW_PREFIX="$(brew --prefix)"
          copy_ffmpeg_dev_files "$ARM64_BREW_PREFIX" "rust_package/native/ffmpeg/darwin-arm64"

          copy_ffmpeg_dev_files "artifacts/ffmpeg-x64-dev" "rust_package/native/ffmpeg/darwin-x64"

          if ! lipo -archs rust_package/native/ffmpeg/darwin-x64/lib/libavcodec.a | grep -q "x86_64"; then
            echo "ERROR: Intel FFmpeg static lib is not x86_64"
            lipo -archs rust_package/native/ffmpeg/darwin-x64/lib/libavcodec.a || true
            exit 1
          fi
          if ! lipo -archs rust_package/native/ffmpeg/darwin-arm64/lib/libavcodec.a | grep -q "arm64"; then
            echo "ERROR: arm64 FFmpeg static lib is not arm64"
            lipo -archs rust_package/native/ffmpeg/darwin-arm64/lib/libavcodec.a || true
            exit 1
          fi

      - name: Validate bundled media tools (macOS)
        run: node scripts/validate-bundled-media-tools.mjs --mode package --platform-key darwin-universal

      - name: Build Rust N-API for mac (both arch)
        working-directory: rust_package
        run: |
          npx --yes @napi-rs/cli@2.18.4 build --platform --release --target x86_64-apple-darwin
          npx --yes @napi-rs/cli@2.18.4 build --platform --release --target aarch64-apple-darwin

      - name: Clean FFmpeg native build inputs (macOS)
        run: rm -rf rust_package/native/ffmpeg/darwin-arm64 rust_package/native/ffmpeg/darwin-x64

      - name: Build (vite)
        env:
          CLOUD_SYNC_BASE_URL_PROD: ${{ secrets.CLOUD_SYNC_BASE_URL_PROD }}
          CLOUD_SYNC_API_SECRET_KEY: ${{ secrets.CLOUD_SYNC_API_SECRET_KEY }}
          FRKB_LASTFM_API_KEY: ${{ secrets.FRKB_LASTFM_API_KEY }}
        run: pnpm build

      - name: Package macOS (universal, no publish)
        env:
          DEBUG: electron-builder
        run: |
          sed -i.bak '/^electron_mirror=/d' .npmrc && rm -f .npmrc.bak
          npx electron-builder --mac --universal --publish never

      - name: Verify macOS RC signing mode
        run: |
          set -euo pipefail
          APP_DIR="$(find dist/mac-universal -maxdepth 1 -name '*.app' -type d | head -n 1 || true)"
          if [ -z "$APP_DIR" ]; then
            echo "macOS app bundle not found under dist/mac-universal"
            exit 1
          fi
          for binary_path in \
            "$APP_DIR/Contents/MacOS/FRKB" \
            "$APP_DIR/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"; do
            signature_info="$(codesign -dvvv "$binary_path" 2>&1)"
            if grep -q 'flags=.*runtime' <<<"$signature_info"; then
              echo "Unexpected Hardened Runtime signature: $binary_path"
              echo "$signature_info"
              exit 1
            fi
          done

      - name: Verify packaged Demucs resources (macOS)
        run: |
          set -euo pipefail
          APP_DIR="$(find dist/mac-universal -maxdepth 1 -name '*.app' -type d | head -n 1 || true)"
          if [ -z "$APP_DIR" ]; then
            echo "macOS app bundle not found under dist/mac-universal"
            exit 1
          fi
          RESOURCES_DIR="${APP_DIR}/Contents/Resources"
          if [ ! -d "$RESOURCES_DIR" ]; then
            echo "macOS resources directory not found: ${RESOURCES_DIR}"
            exit 1
          fi

          node scripts/validate-bundled-media-tools.mjs \
            --mode package --platform-key darwin-universal --root "$RESOURCES_DIR"

          REQUIRED_PATHS=(
            "ffmpeg/darwin/ffmpeg"
            "ffmpeg/darwin/ffprobe"
            "demucs/bootstrap/mixtape_demucs_bootstrap.py"
            "demucs/bootstrap/beat_this_bridge.py"
            "demucs/bootstrap/bpm_fix.py"
            "demucs/bootstrap/bpm_fix_grid.py"
            "demucs/bootstrap/bpm_fix_crosscheck.py"
            "demucs/bootstrap/bpm_fix_rubberband.py"
            "demucs/bootstrap/rkb_official_phase_selector.py"
            "demucs/models/htdemucs.yaml"
            "demucs/models/955717e8-8726e21a.th"
            "rekordboxDesktopLibrary/bridge.py"
            "rekordboxDesktopRuntime/darwin-arm64/python/bin/python3"
            "rekordboxDesktopRuntime/darwin-x64/python/bin/python3"
          )
          UNEXPECTED_PATHS=(
            "demucs/darwin-arm64"
            "demucs/darwin-x64"
            "demucs/win32-x64"
          )

          MISSING=0
          for relative_path in "${REQUIRED_PATHS[@]}"; do
            target_path="${RESOURCES_DIR}/${relative_path}"
            if [ ! -e "$target_path" ]; then
              echo "Missing packaged Demucs resource (macOS): ${relative_path}"
              MISSING=1
            fi
          done
          for relative_path in "${UNEXPECTED_PATHS[@]}"; do
            target_path="${RESOURCES_DIR}/${relative_path}"
            if [ -e "$target_path" ]; then
              echo "Unexpected packaged Demucs runtime (macOS): ${relative_path}"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          python3 scripts/verify_packaged_python_import_closure.py \
            --source-root scripts \
            --packaged-root "${RESOURCES_DIR}/demucs/bootstrap" \
            --entry beat_this_bridge.py

          echo "Packaged Demucs resources verified (macOS, runtime excluded)."

      # 不再复制 rc.yml / rc-mac.yml，保持标准文件名

      - name: Upload dist artifacts (macOS)
        uses: actions/upload-artifact@v7
        if: always() && startsWith(github.ref, 'refs/tags/')
        with:
          name: mac-artifacts
          path: |
            dist/*.dmg
            dist/*.yml
            dist/Track-Studio-*-mac-universal.zip
            dist/Track-Studio-*-mac-universal.zip.blockmap
            dist/*.blockmap
            dist/*.zip

  release:
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        startsWith(github.ref, 'refs/tags/')
      }}
    needs: [validate_release_tag, typecheck, build_win, build_mac]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/release-notes

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: win-artifacts
          path: artifacts/win

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: mac-artifacts
          path: artifacts/mac

      - name: Show downloaded files
        run: ls -R artifacts | cat

      - name: Create/Update GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            artifacts/win/*.exe
            artifacts/win/latest.yml
            artifacts/win/*.blockmap
            artifacts/mac/*.dmg
            artifacts/mac/latest-mac.yml
            artifacts/mac/*.zip
            artifacts/mac/*.blockmap
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi
          for asset in "${assets[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty release asset: $asset"
              exit 1
            fi
          done

          create_notes_args=(--generate-notes)
          edit_notes_args=()
          notes_file=".github/release-notes/${TAG_NAME}.md"
          if [ -f "$notes_file" ]; then
            create_notes_args=(--notes-file "$notes_file")
            edit_notes_args=(--notes-file "$notes_file")
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG_NAME" --title "$TAG_NAME" --prerelease "${edit_notes_args[@]}"
            else
              gh release edit "$TAG_NAME" --title "$TAG_NAME" --latest "${edit_notes_args[@]}"
            fi
          else
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG_NAME" "${assets[@]}" --title "$TAG_NAME" --prerelease --verify-tag "${create_notes_args[@]}"
            else
              gh release create "$TAG_NAME" "${assets[@]}" --title "$TAG_NAME" --latest --verify-tag "${create_notes_args[@]}"
            fi
          fi

      - name: Remove superseded RC releases
        if: contains(github.ref_name, '-rc.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only older versions are superseded. A newer tag may still be building.
          is_older_rc() {
            [[ "$1" != "$TAG_NAME" ]] &&
              [[ "$(printf '%s\n' "$1" "$TAG_NAME" | sort -V | head -n 1)" == "$1" ]]
          }
          mapfile -t stale_tags < <(
            gh release list --limit 1000 --json tagName,isPrerelease \
              --jq ".[] | select(.isPrerelease and .tagName != \"${TAG_NAME}\" and (.tagName | test(\"^[0-9]+\\\\.[0-9]+\\\\.[0-9]+-rc\\\\.\"))) | .tagName"
          )
          for stale_tag in "${stale_tags[@]}"; do
            is_older_rc "$stale_tag" || continue
            echo "Removing superseded RC release and tag: ${stale_tag}"
            gh release delete "${stale_tag}" --yes --cleanup-tag
          done

          # gh release list 只能枚举“有 Release 的 tag”。历史上失败或未产出 Release 的
          # run 会留下孤儿 RC tag（release job 被 skip 时从未创建 Release），
          # 上面的循环永远遍历不到，因此这里按 tag 列表补一次清理。
          mapfile -t orphan_tags < <(
            gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags" \
              --jq '.[].ref' |
              sed 's#^refs/tags/##' |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+-rc\.' |
              grep -v "^${TAG_NAME}$" || true
          )
          for orphan_tag in "${orphan_tags[@]}"; do
            is_older_rc "$orphan_tag" || continue
            if gh release view "${orphan_tag}" >/dev/null 2>&1; then
              # 仍有 Release 的 RC tag 由上一步处理，这里不重复删除
              continue
            fi
            echo "Removing orphan RC tag without release: ${orphan_tag}"
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${orphan_tag}" \
              || echo "WARN: failed to delete orphan tag ${orphan_tag} (需 contents: write 权限)"
          done

      - name: Remove superseded stable releases
        # 正式版发布成功后只保留当前这一版；运行时资源（demucs-*）不参与淘汰。
        if: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 用纯三段版本号正则限定“应用正式版”。不能只按 isPrerelease=false 判断，
          # 因为 demucs-model-assets 这类运行时资源 Release 同样是非预发布。
          mapfile -t stale_tags < <(
            gh release list --limit 1000 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease | not) | .tagName' |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              grep -v "^${TAG_NAME}$" || true
          )
          for stale_tag in "${stale_tags[@]}"; do
            echo "Removing superseded stable release and tag: ${stale_tag}"
            gh release delete "${stale_tag}" --yes --cleanup-tag
          done

          # 同 RC：补清理没有 Release 的孤儿正式版 tag
          mapfile -t orphan_tags < <(
            gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags" \
              --jq '.[].ref' |
              sed 's#^refs/tags/##' |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              grep -v "^${TAG_NAME}$" || true
          )
          for orphan_tag in "${orphan_tags[@]}"; do
            if gh release view "${orphan_tag}" >/dev/null 2>&1; then
              # 仍有 Release 的正式版 tag 由上一步处理，这里不重复删除
              continue
            fi
            echo "Removing orphan stable tag without release: ${orphan_tag}"
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${orphan_tag}" \
              || echo "WARN: failed to delete orphan tag ${orphan_tag} (需 contents: write 权限)"
          done
