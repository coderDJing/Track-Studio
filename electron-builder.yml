# 当前打包以 package.json 的 build 字段为准，本文件不加载。
# 内容与 package.json 对齐，避免后人误把未生效的 appId 当成覆盖升级身份。
appId: com.electron.frkb
productName: Track Studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!drafts{,/**/*}'
  - '!tmp{,/**/*}'
  - '!.codex_tmp{,/**/*}'
  - '!test-data{,/**/*}'
  - '!grid-analysis-lab{,/**/*}'
  - '!structure-analysis-lab{,/**/*}'
asarUnpack:
  - resources/**
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: licenses/LICENSE
  - from: scripts/beat_this_bridge.py
    to: demucs/bootstrap/beat_this_bridge.py
  - from: scripts/beat_this_grid_solver.py
    to: demucs/bootstrap/beat_this_grid_solver.py
  - from: scripts/beat_this_candidate_solver.py
    to: demucs/bootstrap/beat_this_candidate_solver.py
  - from: scripts/beat_this_grid_rescue.py
    to: demucs/bootstrap/beat_this_grid_rescue.py
  - from: scripts/beat_this_full_logit_rescue.py
    to: demucs/bootstrap/beat_this_full_logit_rescue.py
  - from: scripts/beat_this_full_logit_utils.py
    to: demucs/bootstrap/beat_this_full_logit_utils.py
  - from: scripts/beat_this_phase_rescue.py
    to: demucs/bootstrap/beat_this_phase_rescue.py
  - from: scripts/beat_this_phase_arbitration.py
    to: demucs/bootstrap/beat_this_phase_arbitration.py
  - from: scripts/beat_this_bpm_metrics.py
    to: demucs/bootstrap/beat_this_bpm_metrics.py
  - from: scripts/beat_this_window_selection.py
    to: demucs/bootstrap/beat_this_window_selection.py
  - from: scripts
    to: demucs/bootstrap
    filter:
      - beat_this_anchor_tuning_defaults.py
      - beat_this_runtime_constant_grid.py
      - rkb_beatgrid_candidate_lab.py
      - rkb_constant_grid_dp_cache.py
      - rkb_constant_grid_dp_cli.py
      - rkb_constant_grid_dp_high_structural.py
      - rkb_constant_grid_dp_octave.py
      - rkb_constant_grid_dp_phase_path.py
      - rkb_constant_grid_dp_selection.py
      - rkb_constant_grid_dp_solver.py
      - rkb_official_downbeat_selector.py
      - rkb_official_phase_selector.py
      - rkb_locked_phase_ranker.py
      - rkb_locked_phase_ranker_features.py
      - rkb_runtime_candidate_utils.py
      - rkb_runtime_grid_common.py
      - models/rkb-official-downbeat-rotation-candidate-v1.json
  - from: vendor/rekordbox-desktop-runtime
    to: rekordboxDesktopRuntime
  - from: resources/rekordboxDesktopLibrary
    to: rekordboxDesktopLibrary
fileAssociations:
  - ext:
      - mp3
      - wav
      - flac
      - aif
      - aiff
      - ogg
      - opus
      - aac
      - m4a
      - mp4
      - wma
      - ac3
      - dts
      - mka
      - webm
      - ape
      - tak
      - tta
      - wv
    name: Track Studio Audio
    description: Audio files supported by Track Studio
    role: Editor
win:
  executableName: FRKB
  extraResources:
    - from: vendor/demucs/models
      to: demucs/models
    - from: vendor/demucs/bootstrap
      to: demucs/bootstrap
    - from: vendor/ffmpeg/win32-x64/dll
      to: ffmpeg-dlls
  # requestedExecutionLevel: 'requireAdministrator'
nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  artifactName: Track-Studio-${version}-${platform}-${arch}.${ext}
  shortcutName: Track Studio
  uninstallDisplayName: Track Studio
  createDesktopShortcut: true
  installerIcon: 'build/icon.ico'
  uninstallerIcon: 'build/icon.ico'
  include: build/installer.nsh
mac:
  executableName: FRKB
  target:
    - dmg
    - zip
  extraResources:
    - from: vendor/demucs/models
      to: demucs/models
    - from: vendor/demucs/bootstrap
      to: demucs/bootstrap
    - from: vendor/r3-stretch/darwin-universal
      to: r3-stretch/darwin-universal
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: Track-Studio-${version}-mac-${arch}.${ext}
  title: Track Studio ${version}
  background: build/dmg-background.png
  iconSize: 96
  iconTextSize: 12
  contents:
    - x: 370
      y: 250
    - x: 600
      y: 250
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
  extraResources:
    - from: vendor/demucs/models
      to: demucs/models
    - from: vendor/demucs/bootstrap
      to: demucs/bootstrap
    - from: vendor/demucs/linux-x64
      to: demucs/linux-x64
      filter:
        - runtime*/**
    - from: vendor/demucs/linux-arm64
      to: demucs/linux-arm64
      filter:
        - runtime*/**
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: 'coderDjing'
  repo: 'Track-Studio'
releaseInfo:
  releaseNotes: |
    New Features
      - Added read-only analysis support for external Rekordbox libraries, including waveform, beatgrid, cue, and metadata display without writing back to the source library
      - Added temporary dual-track tempo adjustment for external Rekordbox tracks
      - Added a master output limiter with real-time gain-reduction metering to protect the final output while preserving channel volume, EQ, crossfader, and Auto Gain controls
      - Improved fixed-BPM beatgrid phase refinement and four-beat structure analysis

    Bug Fixes
      - Fixed playback continuing to reference the old path after moving songs between playlists or folders, including partial-move recovery and current-track handling
      - Fixed dual-track beatgrid time-basis offsets being overwritten during scans, which could cause grid alignment and Beat Sync drift
      - Fixed rapid search while real-time tempo adjustment is active in dual-track mode
      - Fixed newly created playlist count badges briefly showing counts from another playlist
      - Improved external Rekordbox source guards so analysis and edit operations remain blocked for read-only libraries

    新功能
      - 新增外部 Rekordbox 资料库只读分析支持，可展示波形、网格、Cue 和元数据，不会写回来源资料库
      - 外部 Rekordbox 曲目在双轨模式中支持临时调速
      - 新增主输出限幅器和实时增益衰减表，在保留通道音量、EQ、crossfader 与自动增益控制语义的同时保护最终输出
      - 优化固定 BPM 网格相位精修和四拍段落结构分析

    问题修复
      - 修复歌曲在歌单或目录间移动后播放仍可能访问旧路径的问题，并完善部分移动失败与当前曲目的处理
      - 修复扫描过程中覆盖双轨网格时间基偏移，导致网格对齐和 Beat Sync 漂移的问题
      - 修复双轨实时调速期间快速搜索的异常行为
      - 修复新建歌单曲目数徽标短暂显示其他歌单数量的问题
      - 完善外部 Rekordbox 资料库的只读保护，阻止对来源资料库执行分析和编辑操作
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
